name: Orcestr UI Release
run-name: Orcestr UI Release - ${{ github.ref_name }}

on:
    push:
        tags:
            - 'ui-v*'
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
    contents: read

jobs:
    quality-checks:
        name: Quality Checks
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Run tests
              run: npm test

            - name: Build package
              run: npm run build

            - name: Check bundle budgets
              run: npm run check:bundle

            - name: Pack package
              run: npm run pack:dry-run

    publish:
        name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/ui-v')
        needs: quality-checks
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Check tag version
              shell: bash
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#ui-v}"
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
                    echo "@orcestr/ui version ($PACKAGE_VERSION) does not match tag ($TAG_VERSION)"
                    exit 1
                  fi

            - name: Build package
              run: npm run build

            - name: Publish @orcestr/ui
              run: npm publish --access public

            - name: Create GitHub release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#ui-v}"

                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                    echo "GitHub release $GITHUB_REF_NAME already exists."
                    exit 0
                  fi

                  gh release create "$GITHUB_REF_NAME" \
                    --verify-tag \
                    --latest \
                    --title "@orcestr/ui v${TAG_VERSION}" \
                    --notes "Published to npm: https://www.npmjs.com/package/@orcestr/ui/v/${TAG_VERSION}" \
                    --generate-notes
